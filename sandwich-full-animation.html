<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sandwich Animation</title>
  <style>
    :root {
      --animation-duration: 7s;
      --bread-hue: 0deg;
      --accent-glow: rgba(255, 100, 100, 0.26);
      --wobble: 2deg;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem 1.25rem;
      font-family: system-ui, -apple-system, sans-serif;
      color: #eef1f8;
      background: radial-gradient(circle at top, #252b3b, #0f1117 60%);
    }

    main {
      width: min(100%, 760px);
      padding: 2rem;
      background: rgba(25, 29, 39, 0.94);
      border: 1px solid #31384a;
      border-radius: 28px;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.28);
      text-align: center;
    }

    h1 {
      margin: 0 0 0.75rem;
      font-size: clamp(2rem, 5vw, 3rem);
    }

    p {
      margin: 0 auto 1.5rem;
      max-width: 36rem;
      color: #b1bdd7;
      line-height: 1.5;
    }

    .hash-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem;
      padding: 0.45rem 0.9rem;
      border-radius: 999px;
      background: rgba(255, 100, 100, 0.14);
      border: 1px solid rgba(255, 156, 156, 0.35);
      color: #ffd0d0;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .animation {
      position: relative;
      width: min(100%, 580px);
      aspect-ratio: 1 / 1;
      margin: 0 auto 1.5rem;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.03), 0 24px 60px var(--accent-glow);
      background:
        radial-gradient(circle at 50% 28%, rgba(255, 255, 255, 0.18), transparent 22%),
        linear-gradient(180deg, #2b3142, #1a1d27 55%, #151821);
    }

    .animation svg {
      width: 100%;
      height: 100%;
      display: block;
      filter: hue-rotate(var(--bread-hue));
      transform-origin: 50% 50%;
      animation:
        sandwich-fade var(--animation-duration) ease-in-out infinite,
        sandwich-wobble calc(var(--animation-duration) * 0.5) ease-in-out infinite;
    }

    .bite-mark-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .bite-mark {
      position: absolute;
      width: 16%;
      aspect-ratio: 1 / 1;
      border-radius: 50%;
      transform: translate(-50%, -50%) scale(0);
      background:
        radial-gradient(circle at 45% 42%, rgba(0, 0, 0, 0.34) 0 30%, rgba(0, 0, 0, 0.16) 31% 48%, transparent 49%),
        radial-gradient(circle at 50% 50%, #181b24 0 58%, transparent 59%);
      filter: drop-shadow(0 10px 12px rgba(0, 0, 0, 0.22));
      animation: bite-sequence var(--animation-duration) ease-in-out infinite;
      animation-delay: var(--delay, 0s);
    }

    .links {
      display: flex;
      justify-content: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 2.75rem;
      padding: 0.8rem 1.15rem;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 600;
      color: #fff;
      background: #ff6464;
    }

    .link.secondary {
      background: #2d3548;
    }

    @keyframes bite-sequence {
      0%, 6% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
      12%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    }

    @keyframes sandwich-fade {
      0%, 38% { opacity: 1; }
      52%, 100% { opacity: 0.74; }
    }

    @keyframes sandwich-wobble {
      0%, 100% { transform: rotate(calc(var(--wobble) * -1)) scale(0.995); }
      50% { transform: rotate(var(--wobble)) scale(1.01); }
    }
  </style>
</head>
<body>
  <main>
    <h1>Your Sandwich Gif</h1>
    <p id="description-copy">This replay is generated from the hashed perimeter bites you picked on the sandwich test.</p>
    <div class="hash-pill" id="hash-pill">GIF seed</div>

    <div class="animation" aria-label="Animated sandwich being eaten">
      <svg viewBox="0 0 100 100" aria-hidden="true">
        <defs>
          <radialGradient id="bread-full" cx="50%" cy="35%" r="70%">
            <stop offset="0%" stop-color="#f4d090" />
            <stop offset="65%" stop-color="#e6b56d" />
            <stop offset="100%" stop-color="#cb8f4c" />
          </radialGradient>
        </defs>
        <rect width="100" height="100" fill="transparent" />
        <ellipse cx="50" cy="50" rx="33" ry="24" fill="#815239" opacity="0.28" />
        <ellipse cx="50" cy="49" rx="31" ry="22" fill="url(#bread-full)" />
        <path d="M27 44C35 37 65 37 73 44" stroke="#ffe1a9" stroke-width="4" stroke-linecap="round" />
        <path d="M29 58C37 62 63 62 71 58" stroke="#b85e4b" stroke-width="3.2" stroke-linecap="round" />
        <path d="M31 61C39 66 61 66 69 61" stroke="#74b55d" stroke-width="2.6" stroke-linecap="round" />
      </svg>
      <div class="bite-mark-layer" id="bite-mark-layer" aria-hidden="true"></div>
    </div>

    <div class="links">
      <a class="link secondary" href="sandwich-bite-test.html">Back to the bite test</a>
      <a class="link" href="index.html">Return home</a>
    </div>
  </main>

  <script>
    const DURATION_VARIANCE_RANGE = 2200;
    const WOBBLE_VARIANCE_MASK = 5;
    const WOBBLE_VARIANCE_RANGE = 3;
    const HUE_SHIFT_MASK = 3;
    const HUE_SHIFT_RANGE = 9;

    const DEFAULT_BITES = [
      { x: 73, y: 27 },
      { x: 84, y: 47 },
      { x: 70, y: 71 },
      { x: 36, y: 74 },
      { x: 22, y: 45 },
      { x: 31, y: 30 },
      { x: 56, y: 23 },
      { x: 79, y: 61 }
    ];

    const biteMarkLayer = document.getElementById('bite-mark-layer');
    const hashPill = document.getElementById('hash-pill');
    const descriptionCopy = document.getElementById('description-copy');

    function hashString(value) {
      let hash = 2166136261;

      for (const character of value) {
        hash ^= character.charCodeAt(0);
        hash = Math.imul(hash, 16777619);
      }

      return (hash >>> 0).toString(16).padStart(8, '0');
    }

    function encodeBites(bites) {
      return bites
        .map(({ x, y }) => `${Math.round(x * 10).toString(36)}-${Math.round(y * 10).toString(36)}`)
        .join('_');
    }

    function decodeBites(serialized) {
      if (!serialized) {
        return [];
      }

      return serialized
        .split('_')
        .map((entry) => {
          const [rawX, rawY] = entry.split('-');
          const x = parseInt(rawX, 36) / 10;
          const y = parseInt(rawY, 36) / 10;

          if (!Number.isFinite(x) || !Number.isFinite(y)) {
            return null;
          }

          return {
            x: Math.min(95, Math.max(5, x)),
            y: Math.min(95, Math.max(5, y))
          };
        })
        .filter(Boolean);
    }

    const params = new URLSearchParams(window.location.search);
    const requestedBites = decodeBites(params.get('bites'));
    const bites = requestedBites.length ? requestedBites : DEFAULT_BITES;
    const biteToken = requestedBites.length ? params.get('bites') : encodeBites(DEFAULT_BITES);
    const hash = params.get('hash') || hashString(biteToken);
    const seed = parseInt(hash, 16) >>> 0;
    const duration = 6 + ((seed % DURATION_VARIANCE_RANGE) / 1000);
    const revealWindow = duration * 0.48;
    const biteDelayStep = revealWindow / Math.max(bites.length, 1);
    const glowHue = seed % 360;
    const wobble = 1 + ((seed >> WOBBLE_VARIANCE_MASK) % WOBBLE_VARIANCE_RANGE);
    const hueShift = ((seed >> HUE_SHIFT_MASK) % HUE_SHIFT_RANGE) - 4;

    document.documentElement.style.setProperty('--animation-duration', `${duration.toFixed(2)}s`);
    document.documentElement.style.setProperty('--bread-hue', `${hueShift}deg`);
    document.documentElement.style.setProperty('--accent-glow', `hsla(${glowHue} 80% 68% / 0.24)`);
    document.documentElement.style.setProperty('--wobble', `${wobble}deg`);

    bites.forEach((bite, index) => {
      const mark = document.createElement('div');
      mark.className = 'bite-mark';
      mark.style.left = `${bite.x}%`;
      mark.style.top = `${bite.y}%`;
      mark.style.setProperty('--delay', `${(index * biteDelayStep).toFixed(2)}s`);
      biteMarkLayer.appendChild(mark);
    });

    hashPill.textContent = `GIF seed #${hash}`;
    descriptionCopy.textContent = `This replay was generated from ${bites.length} hashed perimeter bite${bites.length === 1 ? '' : 's'}.`;
  </script>
</body>
</html>
