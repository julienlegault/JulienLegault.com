<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sandwich Animation</title>
  <style>
    :root {
      --accent-glow: rgba(255, 100, 100, 0.26);
      --wobble: 2deg;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 2rem 1.25rem;
      font-family: system-ui, -apple-system, sans-serif;
      color: #eef1f8;
      background: radial-gradient(circle at top, #252b3b, #0f1117 60%);
    }

    main {
      width: min(100%, 760px);
      padding: 2rem;
      background: rgba(25, 29, 39, 0.94);
      border: 1px solid #31384a;
      border-radius: 28px;
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.28);
      text-align: center;
    }

    h1 {
      margin: 0 0 0.75rem;
      font-size: clamp(2rem, 5vw, 3rem);
    }

    p {
      margin: 0 auto 1.5rem;
      max-width: 36rem;
      color: #b1bdd7;
      line-height: 1.5;
    }

    .hash-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1.5rem;
      padding: 0.45rem 0.9rem;
      border-radius: 999px;
      background: rgba(255, 100, 100, 0.14);
      border: 1px solid rgba(255, 156, 156, 0.35);
      color: #ffd0d0;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    .animation-wrap {
      position: relative;
      width: min(100%, 580px);
      aspect-ratio: 1 / 1;
      margin: 0 auto 1.5rem;
      border-radius: 28px;
      overflow: hidden;
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.03), 0 24px 60px var(--accent-glow);
      background: linear-gradient(180deg, #2b3142, #1a1d27 55%, #151821);
    }

    .animation-wrap canvas {
      display: block;
      width: 100%;
      height: 100%;
      animation: sandwich-wobble 3.4s ease-in-out infinite;
      transform-origin: 50% 50%;
    }

    .links {
      display: flex;
      justify-content: center;
      gap: 0.75rem;
      flex-wrap: wrap;
    }

    .link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 2.75rem;
      padding: 0.8rem 1.15rem;
      border-radius: 999px;
      text-decoration: none;
      font-weight: 600;
      color: #fff;
      background: #ff6464;
    }

    .link.secondary {
      background: #2d3548;
    }

    .share-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.45rem;
      min-height: 2.75rem;
      padding: 0.8rem 1.15rem;
      border-radius: 999px;
      border: 0;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 600;
      background: #2d3548;
      color: #eef1f8;
      transition: transform 0.15s ease, background 0.2s ease;
    }

    .share-button:hover,
    .share-button:focus-visible {
      transform: translateY(-1px);
      background: #3a4460;
    }

    .share-button.copied {
      background: #2e5a3a;
      color: #a8e6a3;
    }

    @keyframes sandwich-wobble {
      0%, 100% { transform: rotate(calc(var(--wobble) * -1)) scale(0.995); }
      50% { transform: rotate(var(--wobble)) scale(1.01); }
    }
  </style>
</head>
<body>
  <main>
    <h1>Your Sandwich GIF</h1>
    <p id="replay-description">This replay is generated from the hashed bite path you picked on the sandwich test.</p>
    <div class="hash-pill" id="hash-pill">GIF seed</div>

    <div class="animation-wrap" aria-label="Animated plate being eaten">
      <canvas id="anim-canvas" aria-hidden="true"></canvas>
    </div>

    <div class="links">
      <a class="link secondary" href="sandwich-bite-test.html">Back to the bite test</a>
      <button class="share-button" type="button" id="share-button">🔗 Copy link</button>
      <a class="link" href="index.html">Return home</a>
    </div>
  </main>

  <script src="sandwich-utils.js"></script>
  <script>
    const BITE_RADIUS = 8;
    const GRID_SIZE = 100;
    const DURATION_VARIANCE_RANGE = 2200;
    const WOBBLE_VARIANCE_SHIFT = 5;
    const WOBBLE_VARIANCE_RANGE = 3;
    const HUE_SHIFT_SHIFT = 3;
    const HUE_SHIFT_RANGE = 9;

    const DEFAULT_BITES = [
      { x: 73, y: 27 },
      { x: 84, y: 47 },
      { x: 70, y: 71 },
      { x: 36, y: 74 },
      { x: 22, y: 45 },
      { x: 31, y: 30 },
      { x: 56, y: 23 },
      { x: 79, y: 61 }
    ];

    const canvas = document.getElementById('anim-canvas');
    const ctx = canvas.getContext('2d');
    const wrap = canvas.parentElement;
    const hashPill = document.getElementById('hash-pill');
    const replayDescription = document.getElementById('replay-description');
    const shareButton = document.getElementById('share-button');

    const { HASH_PATTERN, hashString, encodeBites, decodeBites } = window.SandwichUtils;

    // Accept both legacy fragment tokens and query-param tokens.
    const fragmentToken = window.location.hash.slice(1);
    const params = new URLSearchParams(window.location.search);
    const rawBiteToken = fragmentToken || params.get('bites') || '';
    const requestedBites = decodeBites(rawBiteToken);
    const bites = requestedBites.length ? requestedBites : DEFAULT_BITES;
    // Always normalize to compact encoding so the share URL stays short.
    const biteToken = encodeBites(bites);
    const requestedHash = params.get('hash');
    const hash = HASH_PATTERN.test(requestedHash || '') ? requestedHash : hashString(biteToken);

    // Normalize to canonical compact query form whenever bites were provided.
    const canonicalSearch = requestedBites.length ? `?bites=${encodeURIComponent(biteToken)}` : '';
    if (requestedBites.length && window.location.search !== canonicalSearch) {
      history.replaceState(null, '', `${window.location.pathname}${canonicalSearch}`);
    }
    const seed = parseInt(hash, 16);
    const duration = ((6 + ((seed % DURATION_VARIANCE_RANGE) / 1000)) * 1.3) * 1000; // in ms
    const revealWindow = duration * 0.48;
    const biteDelayStep = revealWindow / Math.max(bites.length, 1);
    const glowHue = seed % 360;
    const wobble = 1 + ((seed >> WOBBLE_VARIANCE_SHIFT) % WOBBLE_VARIANCE_RANGE);
    const hueShift = ((seed >> HUE_SHIFT_SHIFT) % HUE_SHIFT_RANGE) - 4;

    document.documentElement.style.setProperty('--accent-glow', `hsla(${glowHue} 80% 68% / 0.24)`);
    document.documentElement.style.setProperty('--wobble', `${wobble}deg`);
    canvas.style.filter = `hue-rotate(${hueShift}deg)`;
    canvas.style.animationDuration = `${(duration / 2 / 1000).toFixed(2)}s`;

    hashPill.textContent = `GIF seed #${hash}`;
    replayDescription.textContent = `This replay was generated from ${bites.length} hashed perimeter bite${bites.length === 1 ? '' : 's'}.`;

    // Times (ms into the cycle) at which each bite becomes visible.
    const biteRevealTimes = bites.map((_, i) => (i + 1) * biteDelayStep);

    function syncCanvasSize() {
      const side = wrap.clientWidth || 580;
      canvas.width = side;
      canvas.height = side;
    }

    function drawFrame(elapsed) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (!plateImage) {
        return;
      }

      ctx.drawImage(plateImage, 0, 0, canvas.width, canvas.height);

      // Determine how many bites have been revealed so far in this cycle.
      const revealedCount = biteRevealTimes.filter((t) => elapsed >= t).length;

      if (revealedCount === 0) {
        return;
      }

      ctx.save();
      ctx.globalCompositeOperation = 'destination-out';

      for (let i = 0; i < revealedCount; i += 1) {
        const bite = bites[i];
        const cx = (bite.x / GRID_SIZE) * canvas.width;
        const cy = (bite.y / GRID_SIZE) * canvas.height;
        const r = (BITE_RADIUS / GRID_SIZE) * canvas.width;

        const gradient = ctx.createRadialGradient(cx, cy, r * 0.6, cx, cy, r);
        gradient.addColorStop(0, 'rgba(0,0,0,1)');
        gradient.addColorStop(1, 'rgba(0,0,0,0.88)');
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.fillStyle = gradient;
        ctx.fill();
      }

      ctx.restore();
    }

    let animStart = null;
    let plateImage = null;

    function animate(timestamp) {
      if (!animStart) {
        animStart = timestamp;
      }

      // Loop elapsed time within the animation cycle.
      const elapsed = (timestamp - animStart) % duration;
      drawFrame(elapsed);
      requestAnimationFrame(animate);
    }

    const img = new Image();
    img.onload = function () {
      plateImage = img;
      syncCanvasSize();
      requestAnimationFrame(animate);
    };
    img.src = 'images/sandwich-plate.jpg';

    const resizeObserver = new ResizeObserver(() => {
      syncCanvasSize();
    });
    resizeObserver.observe(wrap);

    syncCanvasSize();

    shareButton.addEventListener('click', async () => {
      // Build a share URL that carries bites in query params so unfurlers can read them.
      // Derive the base path so this works regardless of deployment subdirectory.
      const basePath = window.location.pathname.replace(/[^/]*$/, '');
      const shortUrl = new URL('sandwich-full-animation.html', window.location.origin + basePath);
      shortUrl.searchParams.set('bites', biteToken);
      let copied = false;

      try {
        await navigator.clipboard.writeText(shortUrl.toString());
        copied = true;
        shareButton.textContent = '✓ Copied!';
        shareButton.classList.add('copied');
      } catch {
        shareButton.textContent = '⚠ Copy failed — try selecting the URL manually';
      }

      setTimeout(() => {
        shareButton.textContent = '🔗 Copy link';
        if (copied) {
          shareButton.classList.remove('copied');
        }
      }, 2000);
    });
  </script>
</body>
</html>
